  - id: "epic-15-retro-item-9-runtime-pcre-pattern-cache"
    epic: 15
    action: "In scope packages/runtime: the preg_* functions cache compiled patterns
      keyed only by pattern text and flags, a process-wide memo of a pure conversion
      that AD-5 allows (decisions/MAINT-2026-10-30-epic-15-items.md). No call ever
      shares a stateful RegExp with another: a g or y pattern is a fresh RegExp from
      the cached source and flags, or one whose lastIndex is reset and that no concurrent
      call can observe. It may be bounded (LRU). Results, errors and preg_last_error
      stay exactly as without the cache. XT-runtime cases show interleaved calls with
      one sticky or global pattern give PHP results; pcre.ts cites the ruling; no
      other runtime behaviour changes"
