# Project overrides for bmad-build-auto (merged over the skill's customize.toml).

[workflow]

# Cross-epic lessons from retrospectives, kept by the orchestrator.
persistent_facts = ["file:_bmad-output/implementation-artifacts/lessons.md"]

# Foreseeable Escalations, reported in the epic context before a Story's first build
# (epic-16-retro-item-3-foreseeable-escalations-precheck, finding P1 of
# _bmad-output/implementation-artifacts/epic-16-retro-2026-10-31.md).
activation_steps_append = ["""
Foreseeable-Escalations pre-check. Do this only when the intent is a Story (`<N>.<s>`) with a manifest `stories/<N>.<s>.md`; skip it for every other kind of work. Carry it out in step 01, right after the epic context `_bmad-output/implementation-artifacts/epic-<N>-context.md` is loaded or compiled and before you plan.

When that file has no `## Foreseeable Escalations` section (a recompile drops it, so check every time), add one at its end, built from what the repository says now, before the Story is planned:

1. **APIs a later Story owns.** For each Story of epic N that is not `done`, and each Test ID in its manifest's `test_ids`, read the Upstream test method's body under `conformance/upstream/framework/tests/`, with the data providers it names and the test-class helpers it calls. List each Upstream class or method it calls that a later Story of the same epic delivers, judged from `epics.md`'s Story text and the later manifests (as `UnionTypeTest` called Story 16.2's `JsonSchema::fromArray` from Story 16.1, ESC-16.1-4). One line per Test ID: the Test ID, the call, the Story that owns it.
2. **Consequence row.** Say whether the epic's Component has its consequence row, both in `tools/xt-coverage/consequences.ts` and as `conformance/xaravel-consequences/<component>.jsonl` (`decisions/MAINT-2026-10-22-consequence-rows.md`). Both paths are Protected: when the row is missing, name it as missing; never add it.
3. **Non-framework Composer dependencies.** List each Composer package outside `illuminate/*` and `laravel/framework` that the Story Test IDs' Upstream test files import (their `use` lines and any class they name), with its entry in `conformance/upstream/framework/composer.json` (as `TypeTest` used `opis/json-schema`, ESC-16.1-1).

Write `None found.` under a heading with nothing in it. Commit the section with the Story's work; `epic-<N>-context.md` is not a Protected Path, and this step edits none.

Then act on it for the Story you are building: each line under 1 that names one of this Story's Test IDs, a missing row under 2 when this Story adds the Component's first Xaravel Tests, and each dependency under 3 that this Story's Test IDs need, is raised as an Escalation before the first build, all in one round, with the trigger AGENTS.md gives it (a Test ID whose call a later Story owns is first checked against the epics.md ordering and AD-16's `blocked-by:` rule). These stop work only on their own Test IDs; carry on with the rest.
"""]

# The Fidelity Review (ESC-8.5-1, AD-15.8, FR-111; docs/ops/fidelity-review.md):
# two fresh-context reviewer subprocesses, reviewer 1 on the other agent CLI,
# whose verdicts are recorded in the Story's spec and counted by story:check.
[[workflow.review_layers]]
id = "fidelity-review"
name = "Fidelity Review"
when = "the work is a Story (`<epic>.<story>`) and `stories/<id>.md` exists for it, or a retrospective action item from epic 9 on whose `action` names a `packages/<component>` (MAINT-2026-10-16, amendment 2026-10-22). Skip it for planning, other retrospective and other non-Story work."
instruction = """
Do not launch a subagent for this layer. Run this command from the project root:

bun run fidelity:review review --story <id> --spec {spec_file} --loop-cli <cli>

`<id>` is the Story id. For a retrospective action item, pass `--item <action item id>` in place of `--story <id>`, here and in the Finalize re-check below, and keep `--spec {spec_file}`. `<cli>` is the agent CLI running this loop: `claude` when you are Claude Code, `codex` when you are Codex. When `<cli>` is `claude`, prefix the command with `XARAVEL_FIDELITY_CLAUDE_MODEL=<your own model id>` (for example `XARAVEL_FIDELITY_CLAUDE_MODEL=claude-opus-5-5 bun run fidelity:review review …`), so the Claude reviewers run on the loop's model rather than the CLI's weaker default. The command runs two fresh-context reviewer subprocesses over the Story's diff against `conformance/review/fidelity.md`, reviewer 1 on the other CLI when it is available, and appends both verdicts to `{spec_file}` under `## Fidelity Review`. Never edit those records.

It can run for over an hour (two 15-minute attempts on the other CLI, then two on the fallback). Run it as one blocking command with a timeout of at least 75 minutes; if your shell tool caps a command below that, start it in the background and wait for it to exit before reading its output. Launch it alongside the other layers.

Its findings: each stdout line of the form `F-<n> <path>: <detail>` is one finding of this layer, and so is each stdout line `NO-VERDICT reviewer <n>: <reason>` (a reviewer that produced no verdict). Exit 0 with no such line is zero findings. Any other exit with no such line (a refusal before the reviewers ran, or a usage error) is one finding: `Fidelity Review produced no verdict: <its stderr>`.

A reject stands (ESC-8.8-1). When the spec already records a reject for the unchanged reviewed tree, the command runs no reviewer, records nothing, exits 1 and prints `STANDING reviewer <n>: reject at tree <tree>` followed by that reject's `F-<n> <path>: <detail>` lines, which are this layer's findings. Answer a standing reject only by fixing its findings, or by supplying the evidence it asks for, both of which change the reviewed tree. Supply evidence outside the bookkeeping paths, as a change to code, tests or the fidelity-review tool's prompt: evidence written in the spec, sprint status or a manifest's `status:` line (the bookkeeping the reviewed tree leaves out) does not change the reviewed tree and does not lift the reject. Never answer it by re-running the review on the same tree to get a different verdict, or by editing or removing its record.

Finalize re-check: `bun run fidelity:review status --story <id> --spec {spec_file}`. When it does not print a line starting with `current`, the reviewed tree changed after this layer ran or a verdict is missing: run this layer again and triage its findings as a new review pass.
"""
