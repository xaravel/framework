# The Upstream baseline run: assertion kinds and Oracle outcomes (Story 2.6,
# FR-3, FR-113, AD-16).
#
# `inventory` runs first: it builds the Oracle image and runs `bun run
# inventory` in it. The image carries Upstream's extension set, so PHPUnit
# calls providers (and lists datasets) that a host without those extensions
# skips. Its output keeps any committed `assertions` and `oracle` for
# unchanged entries, and is the Inventory every leg plans from and `merge`
# writes into.
#
# `leg` runs once per (leg, attempt): the framework on every alpha variant
# (none, sqlite, pgsql, redis, queue-sync@none, queue-database@sqlite,
# queue-redis@redis) and each Pest suite (ai, mcp, boost) on none, twice
# each. Every job builds the Oracle image (`oracle:build`, which builds it
# twice and verifies it), then `bun run baseline run` runs the leg's tests in
# it as the non-root uid 1001 with the recorder, on the host network, against
# the Postgres 18 and Redis 8.10.2 services, and uploads its results file.
#
# `merge` downloads every result and runs `bun run baseline merge`. That fails
# on a missing result, and on any difference between the two attempts
# (`oracle non-determinism: …`) unless the pair is listed in
# conformance/inventory/oracle-nondeterminism.jsonl (decisions/ESC-2.6-1.md),
# whose pinned record it then writes. `merge` uploads `conformance/inventory`
# as the `inventory` artifact, and fails when the committed Inventory differs
# from it, untracked files included. The committed `assertions` and `oracle`
# values are exactly that artifact (docs/ops/baseline.md). No job holds a
# write scope.
name: baseline

on:
  pull_request:
    branches: [main]
    paths:
      - tools/baseline/**
      - tools/oracle/**
      - tools/inventory/**
      - tools/upstream/**
      - conformance/oracle/**
      - conformance/inventory/**
      - conformance/baseline-pin
      - .github/workflows/baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Check the Upstream snapshot
        run: bun run upstream:check
      - name: Check the Oracle locks
        run: bun run oracle:check
      - name: Build the Oracle image and verify it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(bun tools/oracle/oracle.ts tag)"
          bun run oracle:build "xaravel-oracle:${tag}"
      - name: List every suite in the Oracle image
        run: bun run inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-listing
          path: conformance/inventory/
          if-no-files-found: error
          retention-days: 14

  leg:
    needs: inventory
    name: ${{ matrix.leg.suite }} on ${{ matrix.leg.variant }} (attempt ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
        leg:
          - { suite: framework, variant: none }
          - { suite: framework, variant: pgsql }
          - { suite: framework, variant: queue-database@sqlite }
          - { suite: framework, variant: queue-redis@redis }
          - { suite: framework, variant: queue-sync@none }
          - { suite: framework, variant: redis }
          - { suite: framework, variant: sqlite }
          - { suite: ai, variant: none }
          - { suite: mcp, variant: none }
          - { suite: boost, variant: none }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: laravel
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Replace the committed Inventory with the Oracle listing
        run: rm -rf conformance/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inventory-listing
          path: conformance/inventory
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Check the Upstream snapshot
        run: bun run upstream:check
      - name: Check the Oracle locks
        run: bun run oracle:check
      - name: Build the Oracle image and verify it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(bun tools/oracle/oracle.ts tag)"
          bun run oracle:build "xaravel-oracle:${tag}"
      - name: Run the leg
        env:
          SUITE: ${{ matrix.leg.suite }}
          VARIANT: ${{ matrix.leg.variant }}
          ATTEMPT: ${{ matrix.attempt }}
        run: bun run baseline run --suite "$SUITE" --variant "$VARIANT" --attempt "$ATTEMPT" --out baseline-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ matrix.leg.suite }}.${{ matrix.leg.variant }}.${{ matrix.attempt }}
          path: baseline-results/
          if-no-files-found: error
          retention-days: 14

  merge:
    needs: leg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Replace the committed Inventory with the Oracle listing
        run: rm -rf conformance/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inventory-listing
          path: conformance/inventory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: baseline-*
          path: baseline-results
          merge-multiple: true
      - name: Merge the attempts into the Inventory
        run: bun run baseline merge --in baseline-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory
          path: conformance/inventory/
          if-no-files-found: error
          retention-days: 30
      - name: Check that the committed Inventory is the merge output
        run: |
          set -euo pipefail
          git add --intent-to-add conformance/inventory
          git diff --exit-code --stat conformance/inventory
