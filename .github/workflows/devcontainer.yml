# The devcontainer job (Story 5.10; AD-17, AD-28, NFR-1, NFR-7).
#
# One linux-x64 job builds `.devcontainer/`'s image, starts the workspace and
# its `postgres` sidecar with `docker compose up --wait`, then inside the
# workspace runs the pin checks (`bun run devcontainer:pins`, then its
# `runtime` form: non-root, Bun and `redis-server` versions) and a full
# `bun run harness` (no `--fast`). The container sets no `CI`, so the harness
# starts the worktree's own `redis-server` on `.cache/redis.sock` as it does
# locally, and a NOT-RUN Variant would not fail it: this job fails unless the
# harness exits 0 and `bun run devcontainer:alpha` finds no alpha Variant
# NOT-RUN in its report (non-alpha backends have no sidecar until Phase 9, so
# their NOT-RUN is expected; epics.md 5.10 AC2). It runs on PRs that
# change the devcontainer, nightly and on dispatch. It does not duplicate the
# nightly matrix (nightly.yml); arm64 is not built here.
#
# Read-only (`contents: read`), no secrets, `persist-credentials: false`, and
# no action other than the pinned checkout.
name: devcontainer

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "tools/devcontainer/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_FILE: .devcontainer/compose.yaml
      COMPOSE_PROJECT_NAME: xaravel-devcontainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the devcontainer
        run: |
          set -euo pipefail
          # The nested volume mount points, so they are not created root-owned in the checkout.
          mkdir -p .cache node_modules
          # The runner's ids, so the bind-mounted checkout stays writable.
          echo "XARAVEL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "XARAVEL_GID=$(id -g)" >> "$GITHUB_ENV"
          export XARAVEL_UID="$(id -u)" XARAVEL_GID="$(id -g)"
          docker compose build
          docker compose up --detach --wait --wait-timeout 900
      - name: Check the pins inside the container
        run: |
          set -euo pipefail
          docker compose exec -T workspace bun run devcontainer:pins
          docker compose exec -T workspace bun run devcontainer:pins runtime
      - name: Run the harness inside the container
        run: |
          set -uo pipefail
          status=0
          docker compose exec -T workspace bun run harness 2>&1 | tee "$RUNNER_TEMP/harness.txt" || status=$?
          echo "harness exit ${status}"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          docker compose exec -T workspace bun run devcontainer:alpha < "$RUNNER_TEMP/harness.txt"
      - name: Dump the container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the devcontainer
        if: always()
        run: docker compose down -v
