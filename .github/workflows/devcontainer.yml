# The devcontainer job (Story 5.10; AD-17, AD-28, NFR-1, NFR-7).
#
# One linux-x64 job builds `.devcontainer/`'s image, starts the workspace and
# its `postgres` sidecar with `docker compose up --wait`, then inside the
# workspace runs the pin checks (`bun run devcontainer:pins`, then its
# `runtime` form: non-root, Bun and `redis-server` versions) and the Ratchet
# over a full harness run, `bun run ratchet run --ref "$REF"` (no `--fast`,
# `--seed` or `--scope`; `REF` is the PR's head branch, `github.head_ref`, on
# a PR, else `github.ref_name`, `main` on the schedule as in nightly.yml; it is
# used only for Story ownership, while the tree graded is the checkout). The
# Ratchet, not the raw harness exit, judges the run: an unexpected pass it only
# warns about (owned by no open Story, or by a Story other than this ref's)
# does not fail the job, and `-e GITHUB_ACTIONS=true` on that `exec` makes it a
# `::warning::` annotation too; every other difference does fail it (retro 5
# item 11). The container sets
# no `CI`, so the harness starts the worktree's own `redis-server` on
# `.cache/redis.sock` as it does locally, and a NOT-RUN Variant would not fail
# the Ratchet: this job fails unless the Ratchet exits 0 and
# `bun run devcontainer:alpha` finds no alpha Variant NOT-RUN in the merged
# output (the Ratchet writes the harness report to stderr; non-alpha backends
# have no sidecar until Phase 9, so their NOT-RUN is expected; epics.md 5.10
# AC2). It runs on PRs that change the devcontainer, the harness
# (`conformance/harness/**`) or the root pins (`package.json`, `bun.lock`,
# `.bun-version`; retro 5 item 18), nightly and on dispatch.
# It does not duplicate the nightly matrix (nightly.yml); arm64 is not built
# here.
#
# The checkout has full history (`fetch-depth: 0`), as ci.yml's `check` job
# does: the full harness's Xaravel run verifies the Oracle fixtures, which
# needs the merge order from git history.
#
# Read-only (`contents: read`), no secrets, `persist-credentials: false`, and
# no action other than the pinned checkout.
name: devcontainer

on:
  pull_request:
    paths:
      - ".bun-version"
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - "bun.lock"
      - "conformance/harness/**"
      - "package.json"
      - "tools/devcontainer/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devcontainer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_FILE: .devcontainer/compose.yaml
      COMPOSE_PROJECT_NAME: xaravel-devcontainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and start the devcontainer
        run: |
          set -euo pipefail
          # The nested volume mount points, so they are not created root-owned in the checkout.
          mkdir -p .cache node_modules
          # The runner's ids, so the bind-mounted checkout stays writable.
          echo "XARAVEL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "XARAVEL_GID=$(id -g)" >> "$GITHUB_ENV"
          export XARAVEL_UID="$(id -u)" XARAVEL_GID="$(id -g)"
          docker compose build
          docker compose up --detach --wait --wait-timeout 900
      - name: Check the pins inside the container
        run: |
          set -euo pipefail
          docker compose exec -T workspace bun run devcontainer:pins
          docker compose exec -T workspace bun run devcontainer:pins runtime
      - name: Run the harness inside the container
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail
          status=0
          docker compose exec -T -e GITHUB_ACTIONS=true workspace bun run ratchet run --ref "$REF" 2>&1 | tee "$RUNNER_TEMP/harness.txt" || status=$?
          echo "ratchet exit ${status}"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          docker compose exec -T workspace bun run devcontainer:alpha < "$RUNNER_TEMP/harness.txt"
      - name: Dump the container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the devcontainer
        if: always()
        run: docker compose down -v
