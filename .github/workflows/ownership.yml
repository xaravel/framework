# The edit-ownership check (Story 1.5, AD-16, AD-21).
#
# `ownership` runs for PRs into main, from main's copy of this workflow
# (`pull_request_target` runs the base branch's copy), so a PR cannot change
# the check that judges it. It never checks out, installs or runs PR code: the
# checkout is the base commit, the Story manifest is read from it, and the PR's
# head branch and files are read from the GitHub API as data. `edited` re-runs
# it when a PR's base is re-targeted.
#
# In the merge queue (`merge_group`, Story 1.7) the check must report on the
# merge group too. It checks out the group's base commit, never the group
# itself, takes the PR number from the queue ref with `merge-group-pr` on that
# base checkout, and runs the same `pr` command for that PR.
#
# `manifests` validates every committed manifest and the duplicate Test ID
# rule on the checked-out commit: the base for PRs, and main after each push.
name: ownership

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ownership:
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Find the PR
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ "$EVENT_NAME" = merge_group ]; then
            number="$(bun tools/ruleset/ruleset.ts merge-group-pr "$QUEUE_REF")"
          else
            number="$EVENT_PR"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Check edit ownership
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: bun tools/ownership/ownership.ts pr --repo "$REPO" --pr "$PR_NUMBER"

  manifests:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check Story manifests
        run: bun tools/ownership/ownership.ts manifests
