# Release checks (Story 1.8, AD-18, FR-13, NFR-11).
#
# `versions` fails when any workspace's version differs from the root
# package.json version (fix with `bun run release:stamp`). `release-authority`
# fails when any workflow other than job `release` of release.yml holds
# `id-token: write` or runs a publish command. Both run on PRs, in the merge
# queue and on main.
name: release-checks

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check lockstep versions
        run: bun tools/release/release.ts check

  release-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check release authority
        run: bun tools/release/release.ts authority
