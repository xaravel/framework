# The protected-paths check (Story 1.4, AD-16).
#
# Runs only for PRs into main, from main's copy of this workflow
# (`pull_request_target` runs the base branch's copy), so a PR cannot change
# the check that judges it. `edited` re-runs it when a PR's base is re-targeted. It never checks out, installs or runs PR
# code: the checkout is the base commit, and the PR's files, reviews and head
# CODEOWNERS are read from the GitHub API as data. Reviews do not re-trigger
# this workflow; after approving, the Maintainer re-runs the check.
name: protected-paths

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check Protected Paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun tools/protected-paths/protected-paths.ts pr --repo "$REPO" --pr "$PR_NUMBER"
