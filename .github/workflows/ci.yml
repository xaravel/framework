# Continuous integration checks (Story 1.7, AD-16, AD-28, NFR-5).
#
# `audit` is a required check on main: it installs from the frozen lockfile
# without running lifecycle scripts, then fails on any high or critical
# advisory. `workflow-permissions` checks every workflow's permissions.
# Both also run in the merge queue (`merge_group`), so the queue never stalls
# on a required check. The release workflow and the full CI pipeline arrive in
# later Stories.
name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install from the lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: bun audit --audit-level=high

  workflow-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check workflow permissions
        run: bun tools/workflow-permissions/workflow-permissions.ts check
