# Continuous integration checks (Story 1.7, AD-16, AD-28, NFR-5).
#
# `audit` is a required check on main: it installs from the frozen lockfile
# without running lifecycle scripts, then fails on any high or critical
# advisory. `workflow-permissions` checks every workflow's permissions.
# `fixtures` runs `oracle:verify-fixtures`, which fails on any committed
# Oracle fixture whose signature does not verify against
# conformance/oracle/oracle.pub or whose request hash does not match a
# committed request, naming the file (Story 3.3, FR-6, AD-15). It needs no
# install, so it stays fast, and it is a required check on main
# (decisions/MAINT-2026-10-18-epic-3-items.md, Epic 3 retro S2): a forged
# fixture cannot merge. `check` runs the other repository gates: `bun test`,
# the typecheck, the lint, `scaffold:check` and `graph:check` (Epic 1 retro
# R1), plus the assert and Mockery coverage reports. After the typecheck it
# runs `async-surface --all --check` (Story 6.4, AD-6, AD-28): an async public
# method without an `@asyncRoot` tag, or a committed async-surface.json that
# differs from the regenerated one, fails; in the merge queue this catches two
# PRs that are each green but disagree about a seam's async-ness. `check` is a required
# check on main (decisions/ESC-4.4-2.md item 4). `upstream` fetches the Upstream snapshot at the
# Baseline Pin and verifies every tree hash (Story 2.1, FR-1, AD-15), then
# checks that the committed Upstream scans (conformance/scans/facades.jsonl,
# tools/lint-rules/singletons.json, conformance/boot-only-state, and Story
# 3.7's conformance/scans/allowed-identifiers.json, div12-pairs.jsonl,
# phpunit-assertions.jsonl and mockery-api.jsonl) match the snapshot byte for
# byte and runs conformance/tests/xaravel/scans.test.ts and
# usage-scans.test.ts, whose real-snapshot assertions need the synced
# snapshot (Story 3.6, ESC-3.6-1; Story 3.7, ESC-3.7-1).
# `php-fixtures` installs the PHPUnit and Pest fixture projects and runs
# tools/inventory/lister.php and tools/baseline/{runner,recorder}.php against
# them with real PHP, and tools/oracle/api-surface.php against
# php-fixtures/api-surface/ (Story 3.5). It also syncs the Upstream snapshot,
# builds the locked framework install at /tmp/xaravel-inv/framework as
# docs/ops/inventory.md documents (the snapshot, the Oracle lock and
# COMPOSER_ROOT_VERSION read from conformance/baseline-pin), and runs the
# real-PHP blocks of oracle-fixtures.test.ts, oracle-story.test.ts and
# oracle-recheck.test.ts (Story 5.7) against it and those of
# oracle-extract.test.ts (Epic 3 retro item 3). All of them
# run with XARAVEL_PHP_FIXTURES=require, so a missing PHP or vendor/ fails
# instead of skipping (Epic 2 retro R5); oracle-fixtures.test.ts and
# oracle-story.test.ts also fail on a PHP other than 8.5.11, one without
# pcntl, or a missing install, and oracle-extract.test.ts needs only php on
# PATH. setup-php takes only major.minor, so a newer 8.5 patch on the runner
# fails these tests until PHP_VERSION in tools/oracle/oracle.ts moves. It is its own job
# because ubuntu-latest's PHP 8.3 cannot run PHPUnit 13. It is advisory
# until it is added to the required checks in .github/rulesets/main.json. All
# jobs also run in the merge queue (`merge_group`), so the queue never stalls
# on a required check. The Ratchet runs in ratchet.yml (Stories 5.6 and 5.7:
# the PR's reverse-dependency closure and its Story's tests, the full run in
# the merge queue and on main), and the nightly linux/macOS x64/arm64 matrix
# and benchmarks in nightly.yml (Story 5.7); docs/ops/ci.md maps the whole
# AD-28 pipeline.
# `check`, `fixtures` and `php-fixtures` check out full history (`fetch-depth: 0`): the
# per-Story Oracle request files are read in merge order (Story 5.6 AC5).
name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install from the lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        run: bun audit --audit-level=high

  workflow-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check workflow permissions
        run: bun tools/workflow-permissions/workflow-permissions.ts check

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Per-Story Oracle request ownership follows merge order, which needs full history (Story 5.6 AC5).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Verify the Oracle fixtures
        run: bun run oracle:verify-fixtures

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Per-Story Oracle request ownership follows merge order, which needs full history (Story 5.6 AC5).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install from the lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test
        run: bun run test
      - name: Run the Xaravel Tests under the harness
        run: bun run harness --xaravel
      - name: Check the Expectations File
        run: bun run expectations:check
      - name: Check the Skip Reasons
        run: bun run expectations:reasons
      - name: Typecheck
        run: bun run typecheck
      - name: Check the async surface
        run: bun run async-surface --all --check
      - name: Lint
        run: bun run lint
      - name: Check the scaffold
        run: bun run scaffold:check
      - name: Check the dependency graph
        run: bun run graph:check
      - name: Report assertion coverage
        run: bun run assert:coverage
      - name: Report Mockery API coverage
        run: bun run mockery:coverage

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Check the Upstream snapshot
        run: bun run upstream:check
      - name: Check the facade scan
        run: bun run scan:facades --check
      - name: Check the singleton and boot-only-state scan
        run: bun run scan:singletons --check
      - name: Check the closure allowed-identifier scan
        run: bun run scan:closures --check
      - name: Check the DIV-12 pair scan
        run: bun run scan:div12 --check
      - name: Check the test-API usage scan
        run: bun run scan:test-api --check
      - name: Run the scan tests against the snapshot
        run: bun test conformance/tests/xaravel/scans.test.ts conformance/tests/xaravel/usage-scans.test.ts

  php-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Per-Story Oracle request ownership follows merge order, which needs full history (Story 5.6 AC5).
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install from the lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, mbstring, pcntl, tokenizer, xml
          coverage: none
      - name: Install the PHP fixtures
        run: bun run php-fixtures:install
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Build the locked framework install
        run: |
          set -euo pipefail
          version="$(awk '$1 == "laravel/framework" { sub(/^v/, "", $2); print $2 }' conformance/baseline-pin)"
          test -n "$version"
          rm -rf /tmp/xaravel-inv/framework
          mkdir -p /tmp/xaravel-inv
          cp -R conformance/upstream/framework /tmp/xaravel-inv/framework
          chmod -R u+w /tmp/xaravel-inv/framework
          cp conformance/oracle/locks/framework/composer.lock /tmp/xaravel-inv/framework/composer.lock
          COMPOSER_ROOT_VERSION="$version" composer install --no-interaction --no-progress --no-plugins --no-scripts --prefer-dist --working-dir=/tmp/xaravel-inv/framework
      - name: Run the PHP scripts against the fixtures
        run: XARAVEL_PHP_FIXTURES=require bun test conformance/tests/xaravel/php-scripts.test.ts conformance/tests/xaravel/api-surface.test.ts conformance/tests/xaravel/oracle-fixtures.test.ts conformance/tests/xaravel/oracle-story.test.ts conformance/tests/xaravel/oracle-extract.test.ts conformance/tests/xaravel/oracle-recheck.test.ts
