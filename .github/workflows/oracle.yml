# The Oracle image (Story 2.2, FR-6, OQ-9, AD-16).
#
# `build` runs on a PR that touches the Oracle's inputs: it fetches and checks
# the Upstream snapshot, checks the committed locks against it
# (`oracle:check`), then builds the image twice and verifies that both builds
# install exactly the locked package set on PHP 8.5.11 (`oracle:build`).
#
# `oracle` does the same on a push to main or a manual run from main, then
# logs in to GHCR and pushes `ghcr.io/<owner>/xaravel-oracle:<tag>`, where the
# tag is `<framework Pin>-<imagehash>` (`oracle:tag`); the hash covers the four
# locks, the Dockerfile and its dockerignore, so a change to any of them gets
# a new tag. It is the only job that holds `packages: write`, logs in to GHCR
# or pushes; the workflow
# permissions check allows a write scope only in `oracle.yml#oracle`. The
# GitHub token reaches Composer only as a BuildKit secret (docs/ops/oracle.md).
#
# After the push, `oracle` runs the fixture batch (Story 3.2) in the pushed
# image: `oracle:fixtures` evaluates every committed request twice, compares
# the passes and signs each output with ORACLE_SIGNING_KEY, a secret of the
# GitHub environment `oracle` (restricted to main) that no other job can
# read. It uploads conformance/fixtures/ and any ESC-bot-<n>.md it wrote as an
# artifact, which the Maintainer commits through a PR.
#
# `determinism` runs nightly: it builds the image as `build` does and re-runs
# the two passes with `oracle:fixtures --determinism` (no key, no fixtures). A
# difference fails it, and the Escalation it wrote is uploaded.
name: oracle

on:
  pull_request:
    branches: [main]
    paths:
      - conformance/baseline-pin
      - conformance/oracle/**
      - tools/oracle/**
      - tools/upstream/**
      - .github/workflows/oracle.yml
      - package.json
      - bun.lock
      - .bun-version
  push:
    branches: [main]
    paths:
      - conformance/baseline-pin
      - conformance/oracle/**
      - tools/oracle/**
      - tools/upstream/**
      - .github/workflows/oracle.yml
      - package.json
      - bun.lock
      - .bun-version
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Check the Upstream snapshot
        run: bun run upstream:check
      - name: Check the Oracle locks
        run: bun run oracle:check
      - name: Build the Oracle image twice and verify both builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(bun tools/oracle/oracle.ts tag)"
          bun run oracle:build "xaravel-oracle:${tag}"

  oracle:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency: oracle
    environment: oracle
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Check the Upstream snapshot
        run: bun run upstream:check
      - name: Check the Oracle locks
        run: bun run oracle:check
      - name: Name the image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="$(bun tools/oracle/oracle.ts tag)"
          echo "ref=ghcr.io/${OWNER,,}/xaravel-oracle:${tag}" >> "$GITHUB_OUTPUT"
      - name: Build the Oracle image twice and verify both builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: bun run oracle:build "$IMAGE"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push the Oracle image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Generate and sign the Oracle fixtures
        env:
          ORACLE_SIGNING_KEY: ${{ secrets.ORACLE_SIGNING_KEY }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: bun run oracle:fixtures --image "$IMAGE"
      - name: Upload the fixtures and any Escalation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-fixtures
          path: |
            conformance/fixtures/
            conformance/escalations/ESC-bot-*.md
          if-no-files-found: ignore

  determinism:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Sync the Upstream snapshot
        run: bun run upstream:sync
      - name: Check the Upstream snapshot
        run: bun run upstream:check
      - name: Check the Oracle locks
        run: bun run oracle:check
      - name: Build the Oracle image twice and verify both builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(bun tools/oracle/oracle.ts tag)"
          bun run oracle:build "xaravel-oracle:${tag}"
      - name: Evaluate every request twice and compare
        run: bun run oracle:fixtures --determinism
      - name: Upload the Escalation
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-determinism
          path: conformance/escalations/ESC-bot-*.md
          if-no-files-found: ignore
