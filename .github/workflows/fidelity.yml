# The Fidelity Review (Story 8.5; FR-111, AD-15.8, AD-16;
# docs/ops/fidelity-review.md).
#
# On a same-repository, non-draft Story PR (`story/*`) against `main`, two
# jobs review the PR head against conformance/review/fidelity.md and each
# posts one GitHub PR review on the head commit: `APPROVE` when no checklist
# item fails, `REQUEST_CHANGES` with the findings when any does. `reviewer-1` runs as the
# GitHub App `xaravel-fidelity-1` and `reviewer-2` as `xaravel-fidelity-2`, so
# the two reviews come from two distinct identities, neither the PR author;
# `story:check`'s `approvals` clause counts them.
#
# No PR code runs: each job checks out the base sha without credentials and
# reads the PR's diff and its changed Oracle request files through the API.
# GITHUB_TOKEN holds only `contents: read`; the review is posted with the
# App's installation token (Pull requests: write, Contents: read).
#
# The `base.ref == 'main'` guard keeps the `fidelity` secrets out of a
# `story/*` PR against another base, which would run that branch's copy of
# this workflow; the `fidelity` environment is also restricted to `main`.
# Drafts are skipped, so they cost nothing; `ready_for_review` reviews them
# when they leave draft.
#
# When an App, its key or ANTHROPIC_API_KEY is not configured, the job prints
# a warning and skips its review; it ends green, since it is not a required
# check, and the `approvals` clause stays the failing gate.
name: fidelity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  reviewer-1:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'story/') &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: fidelity
    concurrency:
      group: fidelity-${{ github.event.pull_request.number }}-reviewer-1
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # The keys themselves never enter this step: it sees only whether each secret is set.
      - name: Check the reviewer App is configured
        id: configured
        env:
          APP_ID: ${{ vars.XARAVEL_FIDELITY_1_APP_ID }}
          HAS_APP_KEY: ${{ secrets.XARAVEL_FIDELITY_1_APP_KEY != '' }}
          HAS_MODEL_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ -z "${APP_ID}" ] || [ "${HAS_APP_KEY}" != "true" ] || [ "${HAS_MODEL_KEY}" != "true" ]; then
            echo "::warning::The Fidelity Review is not configured: set vars.XARAVEL_FIDELITY_1_APP_ID, secrets.XARAVEL_FIDELITY_1_APP_KEY and secrets.ANTHROPIC_API_KEY in the fidelity environment (docs/ops/fidelity-review.md, ESC-8.5-1). No review is posted."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.configured.outputs.ok == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install from the lockfile
        if: steps.configured.outputs.ok == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Get the reviewer App token
        id: app
        if: steps.configured.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.XARAVEL_FIDELITY_1_APP_ID }}
          private-key: ${{ secrets.XARAVEL_FIDELITY_1_APP_KEY }}
          permission-pull-requests: write
          permission-contents: read
      - name: Fetch the Upstream snapshot
        if: steps.configured.outputs.ok == 'true'
        run: bun run upstream:sync
      - name: Review the PR
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XARAVEL_FIDELITY_MODEL: ${{ vars.XARAVEL_FIDELITY_MODEL || 'claude-opus-5-5' }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: bun run fidelity:review review --pr "$PR" --sha "$SHA" --reviewer 1 --login "${APP_SLUG}[bot]"

  reviewer-2:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'story/') &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: fidelity
    concurrency:
      group: fidelity-${{ github.event.pull_request.number }}-reviewer-2
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # The keys themselves never enter this step: it sees only whether each secret is set.
      - name: Check the reviewer App is configured
        id: configured
        env:
          APP_ID: ${{ vars.XARAVEL_FIDELITY_2_APP_ID }}
          HAS_APP_KEY: ${{ secrets.XARAVEL_FIDELITY_2_APP_KEY != '' }}
          HAS_MODEL_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ -z "${APP_ID}" ] || [ "${HAS_APP_KEY}" != "true" ] || [ "${HAS_MODEL_KEY}" != "true" ]; then
            echo "::warning::The Fidelity Review is not configured: set vars.XARAVEL_FIDELITY_2_APP_ID, secrets.XARAVEL_FIDELITY_2_APP_KEY and secrets.ANTHROPIC_API_KEY in the fidelity environment (docs/ops/fidelity-review.md, ESC-8.5-1). No review is posted."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.configured.outputs.ok == 'true'
        with:
          bun-version-file: .bun-version
      - name: Install from the lockfile
        if: steps.configured.outputs.ok == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Get the reviewer App token
        id: app
        if: steps.configured.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.XARAVEL_FIDELITY_2_APP_ID }}
          private-key: ${{ secrets.XARAVEL_FIDELITY_2_APP_KEY }}
          permission-pull-requests: write
          permission-contents: read
      - name: Fetch the Upstream snapshot
        if: steps.configured.outputs.ok == 'true'
        run: bun run upstream:sync
      - name: Review the PR
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XARAVEL_FIDELITY_MODEL: ${{ vars.XARAVEL_FIDELITY_MODEL || 'claude-opus-5-5' }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: bun run fidelity:review review --pr "$PR" --sha "$SHA" --reviewer 2 --login "${APP_SLUG}[bot]"
