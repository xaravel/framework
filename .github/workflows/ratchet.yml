# The Ratchet (Stories 5.6 and 5.7; FR-3, AD-2, AD-15, AD-16, AD-28).
#
# `ratchet` runs the conformance harness and fails on every unexpected
# failure, and on every unexpected pass that the run's own Story owns
# (`bun tools/ratchet/ratchet.ts run`, docs/ops/ratchet.md). Other unexpected
# passes are warnings. It is a required check on main
# (.github/rulesets/main.json, Story 5.7).
#
# On a PR it runs under `pull_request_target`, so this workflow and the tool
# come from the base. The base is checked out at `.` and the PR head at `pr/`.
# `scope` first compares the two trees and writes the AD-2 reverse-dependency
# closure of what the PR changed (before the overlay, so a PR's change to a
# grader package still widens the scope). `lockfile` then fails a PR whose
# bun.lock differs from the base's with a plain "can't ratchet a dependency
# change" error, since the run installs from the base's lockfile and a person
# reviews that change instead. `overlay` then restores every
# Protected Path (the harness, tools/, the grader packages, stories/, the root
# bunfig.toml, package.json and bun.lock) and the sprint status from the base
# into `pr/`. So the check's workflow, tool and Protected Paths are the base's
# at the start of the run. `run --scope` grades only that closure (none at
# all for a docs-only PR; everything when a non-package path changed), and
# `story` then runs the Story's own `test_ids` in full on every Variant
# (skipped for a non-Story branch or a manifest with no `test_ids`). Code a
# PR's tests run in-process is not contained, as with any test runner; the
# Ratchet's outcome comparison and review guard that. The job's safety rests
# on the same-repository guard (below), `contents: read`, no secrets,
# `persist-credentials: false`, and the overlay.
#
# Only a same-repository PR runs: the PR checkout and every step that runs PR
# code require `head.repo.full_name == github.repository`, as oracle.yml does.
# A fork PR would otherwise skip first-time-contributor approval and run its
# own code in the base branch's cache scope. Because `ratchet` is a required
# check and a skipped required check counts as passing, a fork PR fails
# closed: "Refuse a fork PR" exits 1 with an `::error::` naming the fork
# (read through env only) before any PR code is fetched.
#
# In the merge queue (`merge_group`) GitHub runs this workflow from the merge
# group commit, so the PR's own copy runs; its trust rests on the
# `pull_request_target` run of the base copy having gated the PR first, as in
# ownership.yml. It checks out the group commit (`github.sha`), takes the PR
# number from the queue ref with `ruleset.ts merge-group-pr`, reads the PR's
# head branch with `gh pr view` (the job's only use of `pull-requests: read`)
# and runs the full Ratchet for that ref. On push to main it grades main
# itself, in full. The nightly matrix is nightly.yml.
#
# Every alpha Variant runs (`CI=true`: an unreachable one is a failure), with
# the Postgres 18 and Redis 8.10.2 services. No step passes `--fast`.
name: ratchet

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Refuse a fork PR
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "::error::the Ratchet does not run a fork PR's code under pull_request_target; push the branch to this repository and open a new PR from it (head repository: ${HEAD_REPO:-<deleted fork>})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Scope the PR
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        run: bun tools/ratchet/ratchet.ts scope --base . --head pr --out "$RUNNER_TEMP/ratchet-scope.json"
      - name: Refuse a dependency change
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        run: bun tools/ratchet/ratchet.ts lockfile --base . --head pr
      - name: Restore the grader from the base
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        run: bun tools/ratchet/ratchet.ts overlay --base . --head pr
      - name: Install the PR from the base lockfile
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: pr
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Ratchet the PR over its scope
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bun tools/ratchet/ratchet.ts run --root pr --ref "$HEAD_REF" --scope "$RUNNER_TEMP/ratchet-scope.json"
      - name: Run the Story's tests in full
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bun tools/ratchet/ratchet.ts story --root pr --ref "$HEAD_REF"
      - name: Install from the lockfile
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Find the queued PR's head branch
        id: pr
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          number="$(bun tools/ruleset/ruleset.ts merge-group-pr "$QUEUE_REF")"
          ref="$(gh pr view "$number" --repo "$REPO" --json headRefName --jq .headRefName)"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Ratchet the merge group
        if: github.event_name == 'merge_group'
        env:
          HEAD_REF: ${{ steps.pr.outputs.ref }}
        run: bun tools/ratchet/ratchet.ts run --root . --ref "$HEAD_REF"
      - name: Ratchet main
        if: github.event_name == 'push'
        run: bun tools/ratchet/ratchet.ts run --root . --ref main
